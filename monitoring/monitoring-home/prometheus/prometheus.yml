global:
  scrape_interval: 1m

scrape_configs:
  # Job for Prometheus itself
  - job_name: "prometheus"
    scrape_interval: 1m
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: "cadvisor"
    scrape_interval: 5s
    static_configs:
      - targets: ["cadvisor:8080"]

  # --- PI 5 Metrics ---
  - job_name: "pi5-node"
    static_configs:
      - targets: ["node-exporter:9100"] # Node exporter on Application Server
        labels:
          instance: "raspberry-pi-5"

  # --- Application Server Metrics ---
  - job_name: "application-server-node"
    static_configs:
      - targets: ["<APPLICATION_SERVER_IP>:9100"] # Node exporter on Application Server
        labels:
          instance: "application-server"

  # - job_name: 'application-server-cadvisor'
  # static_configs:
  # - targets: ['<APPLICATION_SERVER_IP>:8081'] # cAdvisor on Application Server

  # --- Desktop Workstation Metrics ---
  - job_name: "desktop-node"
    static_configs:
      - targets: ["<DESKTOP_IP>:9100"] # Node exporter on the desktop workstation
        labels:
          instance: "desktop-workstation"

  # --- TrueNAS Metrics ---
  - job_name: "tn-node"
    static_configs:
      - targets: ["<TN_IP>:9100"] # Node exporter on RPi
        labels:
          instance: "truenas-scale"

  # --- GPU Compute Metrics ---
  - job_name: "gpu-compute-node"
    static_configs:
      - targets: ["<GPU_COMPUTE_IP>:9100"] # Node exporter on GPU Compute
        labels:
          instance: "gpu-compute"
