services:
  core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - 8086:8080
    volumes:
      - /mnt/nfs/apps/searxng/core-config:/etc/searxng/:Z
      - core-data:/var/cache/searxng/
    networks:
      - traefik-proxy
      - searxng-net
    labels:
      - traefik.enable=true

      - traefik.http.routers.searxng.rule=Host(`search.${DOMAIN}`)
      - traefik.http.routers.searxng.entrypoints=websecure
      - traefik.http.routers.searxng.tls=true
      - traefik.http.routers.searxng.tls.certresolver=cloudflare

      - traefik.http.routers.searxng-lan.rule=Host(`search.${SUBDOMAIN}.${DOMAIN}`)
      - traefik.http.routers.searxng-lan.entrypoints=websecure
      - traefik.http.routers.searxng-lan.tls=true
      - traefik.http.routers.searxng-lan.tls.certresolver=cloudflare

      - traefik.http.services.searxng.loadbalancer.server.port=8080

  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-data:/data/
    networks:
      - searxng-net

networks:
  traefik-proxy:
    external: true
  searxng-net:
    external: false

volumes:
  core-data:
  valkey-data:
