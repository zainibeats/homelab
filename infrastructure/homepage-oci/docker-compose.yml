name: homepage-oci

networks:
  services:
    external: true # created by netbird-server, routed to NetBird peers by netbird-client

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage-oci
    restart: unless-stopped
    env_file: .env # HOMEPAGE_VAR_* values are substituted into config/
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_HOST}
      # The entrypoint chowns config/ to PUID:PGID, so match the clone's owner.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: America/Los_Angeles
    # No published ports: NetBird peers reach it through Traefik. On "services" the
    # game status widgets query the servers directly.
    networks:
      services:
        ipv4_address: ${HOMEPAGE_IP}
    volumes:
      - ./config:/app/config
    labels:
      - traefik.enable=true
      - traefik.docker.network=services
      - traefik.http.middlewares.homepage-oci-netbird-only.ipallowlist.sourcerange=${ALLOWED_RANGES}
      - traefik.http.routers.homepage-oci.rule=Host(`${HOMEPAGE_HOST}`)
      - traefik.http.routers.homepage-oci.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.homepage-oci.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.homepage-oci.middlewares=homepage-oci-netbird-only
      - traefik.http.services.homepage-oci.loadbalancer.server.port=3000
