services:
  netbird-client:
    image: netbirdio/netbird:0.79.0
    container_name: netbird-client
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    env_file: .env
    environment:
      - NB_SETUP_KEY=${NB_SETUP_KEY}
      - NB_MANAGEMENT_URL=${NB_MANAGEMENT_URL}
      - NB_HOSTNAME=${HOSTNAME}
    volumes:
      - ./netbird:/var/lib/netbird
    labels:
      - com.centurylinklabs.watchtower.enable=false   # pinned with the NetBird server; upgrade together
    networks:
      services:
        ipv4_address: ${NETBIRD_CLIENT_IP:?set NETBIRD_CLIENT_IP in .env}

networks:
  services:
    name: services
    # true on a host where the netbird-server stack already created "services"
    external: ${SERVICES_EXTERNAL:-false}
    driver: bridge
    ipam:
      config:
        - subnet: ${SERVICES_SUBNET:?set SERVICES_SUBNET in .env (unique per host)}
          gateway: ${SERVICES_GATEWAY:?set SERVICES_GATEWAY in .env}
