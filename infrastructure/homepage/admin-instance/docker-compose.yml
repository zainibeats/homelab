services:
  homepage-admin:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage-admin
    env_file: .env
    environment:
      HOMEPAGE_ALLOWED_HOSTS: $HOMEPAGE_ALLOWED_HOSTS # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
      PUID: 1000 # optional, your user id
      PGID: 1000 # optional, your group id
      TZ: America/Los_Angeles
    ports:
      - 3330:3000
    volumes:
      - ./config:/app/config # Make sure your local config directory exists
    restart: unless-stopped
    networks:
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage-admin.rule=Host(`admin.${DOMAIN}`)
      - traefik.http.routers.homepage-admin.entrypoints=websecure
      - traefik.http.routers.homepage-admin.tls=true
      - traefik.http.routers.homepage-admin.tls.certresolver=cloudflare
      - traefik.http.services.homepage-admin.loadbalancer.server.port=3000

networks:
  traefik-proxy:
    external: true
