    style: column
    rows: 2
    tab: Local
    icon: mdi-home-automation-#FFFFFF

  Network (Local):
    style: row
    columns: 3
    tab: Local
    icon: mdi-network-#FFFFFF

  Arr Suite (Local):
    style: row
    columns: 1
    tab: Local
    icon: mdi-sail-boat-#FFFFFF
