title: Zaini.cloud
headerStyle: boxed
theme: dark
hideVersion: true
instanceName: public

background:
  image: https://images.unsplash.com/photo-1502790671504-542ad42d5189?auto=format&fit=crop&w=2560&q=80
  blur: xl
  brightness: 90
  opacity: 60

cardBlur: sm

providers:
  openweathermap: openweathermapapikey
  weatherapi: weatherapiapikey
  finnhub: apikeyapikeyapikeyapikey

layout:
  Media:
    style: column
    rows: 4
    tab: Home
    icon: mdi-movie-open-play-#FFFFFF

  Storage and Backups:
    style: column
    rows: 4
    tab: Home
    icon: mdi-cloud-upload-#FFFFFF

  Tools:
    style: column
    rows: 2
    tab: Home
    icon: mdi-tools-#FFFFFF

  Media (Local):
    style: column
    rows: 4
    tab: Local
    icon: mdi-movie-open-play-#FFFFFF

  Storage and Backups (Local):
    style: column
    rows: 3
    tab: Local
    icon: mdi-cloud-upload-#FFFFFF

  Stocks:
    icon: mdi-finance-#FFFFFF
    style: row
    columns: 4
    iconsOnly: true
