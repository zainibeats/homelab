services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun # If running on an LXC see readme for more info.
    networks:
      servarrnetwork:
        ipv4_address: 172.69.0.2
    ports:
      - 8122:8123 # qbittorrent web interface
      - 6881:6881 # qbittorrent torrent port
      - 9696:9696 # prowlarr
    volumes:
      - /mnt/nfs/apps/arr/gluetun:/gluetun
    env_file:
      - .env
    healthcheck:
      test: ping -c 1 www.mullvad.net || exit 1
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    labels:
      - deunhealth.restart.on.unhealthy=true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - WEBUI_PORT=8123
    volumes:
      - ./qbittorrent:/config
      - /mnt/nfs/jellyfin:/data
      - /mnt/WD-ExtHDD/Jellyfin:/external
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    network_mode: service:gluetun
    healthcheck:
        test: ping -c 1 www.mullvad.net || exit 1
        interval: 60s
        retries: 3
        start_period: 20s
        timeout: 10s

# See the 'qBittorrent Stalls with VPN Timeout' section for more information.
  deunhealth:
    image: qmcgaw/deunhealth
    container_name: deunhealth
    network_mode: "none"
    environment:
      - LOG_LEVEL=info
      - HEALTH_SERVER_ADDRESS=127.0.0.1:9999
      - TZ=${TZ}
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1010
      - PGID=1010
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./prowlarr:/config
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    network_mode: service:gluetun

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/nfs/apps/arr/sonarr:/config
      - /mnt/truenas_data/jellyfin_data:/data
      - /mnt/truenas_data/jellyfin_data/tv:/tv
    ports:
      - 8989:8989
    networks:
      traefik-proxy:
      servarrnetwork:
        ipv4_address: 172.69.0.3
    labels:
      - traefik.enable=true

      - traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.routers.sonarr.tls=true
      - traefik.http.routers.sonarr.tls.certresolver=cloudflare

      - traefik.http.routers.sonarr-lan.rule=Host(`sonarr.${SUBDOMAIN}.${DOMAIN}`)
      - traefik.http.routers.sonarr-lan.entrypoints=websecure
      - traefik.http.routers.sonarr-lan.tls=true
      - traefik.http.routers.sonarr-lan.tls.certresolver=cloudflare

      - traefik.http.services.sonarr.loadbalancer.server.port=8989

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/nfs/apps/arr/radarr:/config
      - /mnt/truenas_data/jellyfin_data:/data
      - /mnt/truenas_data/jellyfin_data/movies:/movies
    ports:
      - 7878:7878
    networks:
      traefik-proxy:
      servarrnetwork:
        ipv4_address: 172.69.0.4
    labels:
      - traefik.enable=true

      - traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.tls=true
      - traefik.http.routers.radarr.tls.certresolver=cloudflare

      - traefik.http.routers.radarr-lan.rule=Host(`radarr.${SUBDOMAIN}.${DOMAIN}`)
      - traefik.http.routers.radarr-lan.entrypoints=websecure
      - traefik.http.routers.radarr-lan.tls=true
      - traefik.http.routers.radarr-lan.tls.certresolver=cloudflare

      - traefik.http.services.radarr.loadbalancer.server.port=7878

  lidarr:
    container_name: lidarr
    image: lscr.io/linuxserver/lidarr:latest
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/nfs/apps/arr/lidarr:/config
      - /mnt/truenas_data/jellyfin_data/music/itunes-archive:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    ports:
      - 8686:8686
    networks:
      traefik-proxy:
      servarrnetwork:
        ipv4_address: 172.69.0.5
    labels:
      - traefik.enable=true

      - traefik.http.routers.lidarr.rule=Host(`lidarr.${DOMAIN}`)
      - traefik.http.routers.lidarr.entrypoints=websecure
      - traefik.http.routers.lidarr.tls=true
      - traefik.http.routers.lidarr.tls.certresolver=cloudflare

      - traefik.http.routers.lidarr-lan.rule=Host(`lidarr.${SUBDOMAIN}.${DOMAIN}`)
      - traefik.http.routers.lidarr-lan.entrypoints=websecure
      - traefik.http.routers.lidarr-lan.tls=true
      - traefik.http.routers.lidarr-lan.tls.certresolver=cloudflare

      - traefik.http.services.lidarr.loadbalancer.server.port=8686

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mnt/nfs/apps/arr/bazarr:/config
      - /mnt/truenas_data/jellyfin_data:/data
    ports:
      - 6767:6767
    networks:
      traefik-proxy:
      servarrnetwork:
        ipv4_address: 172.69.0.6
    labels:
      - traefik.enable=true

      - traefik.http.routers.bazarr.rule=Host(`bazarr.${DOMAIN}`)
      - traefik.http.routers.bazarr.entrypoints=websecure
      - traefik.http.routers.bazarr.tls=true
      - traefik.http.routers.bazarr.tls.certresolver=cloudflare

      - traefik.http.routers.bazarr-lan.rule=Host(`bazarr.${SUBDOMAIN}.${DOMAIN}`)
      - traefik.http.routers.bazarr-lan.entrypoints=websecure
      - traefik.http.routers.bazarr-lan.tls=true
      - traefik.http.routers.bazarr-lan.tls.certresolver=cloudflare

      - traefik.http.services.bazarr.loadbalancer.server.port=6767

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
      - PORT=5055 #optional
    ports:
      - 5055:5055
    volumes:
      - /mnt/nfs/apps/arr/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    networks:
      traefik-proxy:
      servarrnetwork:
        ipv4_address: 172.69.0.8
    restart: unless-stopped
    labels:
      - traefik.enable=true

      - traefik.http.routers.seerr.rule=Host(`seerr.${DOMAIN}`)
      - traefik.http.routers.seerr.entrypoints=websecure
      - traefik.http.routers.seerr.tls=true
      - traefik.http.routers.seerr.tls.certresolver=cloudflare

      - traefik.http.routers.seerr-lan.rule=Host(`seerr.${SUBDOMAIN}.${DOMAIN}`)
      - traefik.http.routers.seerr-lan.entrypoints=websecure
      - traefik.http.routers.seerr-lan.tls=true
      - traefik.http.routers.seerr-lan.tls.certresolver=cloudflare

      - traefik.http.services.seerr.loadbalancer.server.port=5055

networks:
  servarrnetwork:
    name: servarrnetwork
    ipam:
      config:
        - subnet: 172.69.0.0/24
  traefik-proxy:
    external: true
