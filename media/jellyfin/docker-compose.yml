services:
  jellyfin:
    image: jellyfin/jellyfin
    network_mode: 'host'
    restart: 'unless-stopped'
    container_name: jellyfin
    environment:
      - JELLYFIN_CACHE_DIR=/var/cache/jellyfin
      - JELLYFIN_CONFIG_DIR=/etc/jellyfin
      - JELLYFIN_DATA_DIR=/var/lib/jellyfin
      - JELLYFIN_LOG_DIR=/var/log/jellyfin
    volumes:
      - /mnt/nfs/apps/jellyfin/config:/etc/jellyfin
      - /var/cache/jellyfin:/var/cache/jellyfin
      - /mnt/nfs/apps/jellyfin/data:/var/lib/jellyfin
      - /mnt/nfs/apps/jellyfin/log:/var/log/jellyfin
      - /mnt/nfs/jellyfin:/mnt/truenas_data/jellyfin_data
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
