[defaults]
# Defaults to the lab. Production must be named explicitly with -i.
inventory = ./inventory/lab/hosts.yml
roles_path = ./roles
host_key_checking = True
interpreter_python = auto_silent

[ssh_connection]
# Trust a new VM's host key on first connect; still refuse a changed one.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
