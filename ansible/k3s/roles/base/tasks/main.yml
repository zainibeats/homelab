- name: Assert the host runs Debian
  ansible.builtin.assert:
    that: ansible_facts['distribution'] == 'Debian'
    fail_msg: "This role targets Debian; found {{ ansible_facts['distribution'] }}."

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# Starts on its own once the VM has the agent device (qemu_agent_enabled = true in OpenTofu).
- name: Install QEMU guest agent on KVM guests
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
  when:
    - ansible_facts['virtualization_type'] == 'kvm'
    - ansible_facts['virtualization_role'] == 'guest'

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Allow SSH keys only
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh
