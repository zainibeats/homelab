ansible_user: debian

# k3s.orchestration settings. Pin the same version in production.
k3s_version: v1.36.5+k3s1
api_endpoint: "{{ hostvars[groups['server'][0]]['ansible_host'] | default(groups['server'][0]) }}"
cluster_context: k3s-lab
# --cluster-init: embedded etcd, so more servers can join later (as in production).
# --disable servicelb: MetalLB replaces k3s's built-in load balancer.
extra_server_args: "--cluster-init --disable servicelb"
# token is omitted on purpose: the first server generates one.

# Placeholder; used from Phase 1 step 2 (wildcard cert). Replace with your domain.
lab_domain: lab.domain.example
