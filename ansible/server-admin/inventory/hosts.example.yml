all:
  children:

    debian_servers:
      hosts:
        application_server:
          ansible_host: APPLICATION_SERVER_IP
          ansible_port: 2222
        raspberry_pi:
          ansible_host: RASPBERRY_PI_IP
        gpu_compute:
          ansible_host: GPU_COMPUTE_IP
        azure_jump_server:
          ansible_host: AZURE_JUMP_SERVER_IP
          ansible_user: azureuser

    homelab_servers:
      hosts:
        application_server:
        raspberry_pi:
        gpu_compute:

    cloud_servers:
      hosts:
        azure_jump_server:

  vars:
    ansible_user: ansible
    ansible_ssh_private_key_file: ~/.ssh/homelab_ansible
