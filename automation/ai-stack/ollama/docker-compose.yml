name: ollama

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    network_mode: host
    tty: true
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-127.0.0.1:11434}   # 0.0.0.0 so Open WebUI can reach it via host.docker.internal
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
      - ${MODELS_DIR}:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # Or specify device IDs like ['0']
              capabilities: [gpu]

volumes:
  ollama:

