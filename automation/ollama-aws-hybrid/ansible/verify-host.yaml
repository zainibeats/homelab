- name: Verify Open WebUI host prerequisites
  hosts: open_webui
  gather_facts: true

  tasks:
    - name: Display operating system distribution
      ansible.builtin.debug:
        var: ansible_distribution
    - name: Gather service facts
      ansible.builtin.service_facts:
    - name: Verify Docker is running and enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['docker.service'].state == 'running'
          - ansible_facts.services['docker.service'].status == 'enabled'
        fail_msg: Docker is not running and/or not enabled
