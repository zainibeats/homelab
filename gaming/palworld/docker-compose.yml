services:
  palworld:
    image: thijsvanloef/palworld-server-docker:latest
    restart: unless-stopped
    container_name: palworld-server-01
    stop_grace_period: 30s # Set to however long you are willing to wait for the container to gracefully stop
    env_file:
       -  .env
    volumes:
       - ./data:/palworld/
    networks:
      services:
        ipv4_address: ${PALWORLD_IP:?set PALWORLD_IP in .env}   # on the NetBird-routed "services" network

networks:
  services:
    external: true
    name: services   # created by infrastructure/netbird-server or infrastructure/netbird-client
