services:
  valheim:
    image: tsxcloud/valheim-arm:latest
    container_name: valheim-server
    restart: unless-stopped
    stop_grace_period: 2m
    cap_add:
      - sys_nice
    env_file: .env
    environment:
      TZ: ${TZ}
      SERVER_NAME: ${SERVER_NAME}
      SERVER_WORLD: ${WORLD_NAME}
      SERVER_PASSWORD: ${SERVER_PASS}
      SERVER_VISIBILITY: ${SERVER_PUBLIC}
      ENABLE_PLUGINS: "false"
      ENABLE_CROSSPLAY: "false"
    ports:
      - "2456-2458:2456-2458/udp"
      - "9001:9001/tcp"
    volumes:
      - ./config:/root/.config/unity3d/IronGate/Valheim
      - ./data:/root/valheim-server
    networks:
      services:
        ipv4_address: 172.110.2.10

  netbird:
    image: netbirdio/netbird:latest
    container_name: netbird-client
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    env_file: .env
    environment:
      - NB_SETUP_KEY=${NB_SETUP_KEY}
      - NB_MANAGEMENT_URL=${NB_MANAGEMENT_URL}
      - NB_HOSTNAME=valheim-oci
    volumes:
      - ./netbird:/var/lib/netbird
    networks:
      services:
        ipv4_address: 172.110.2.2

networks:
  services:
    name: services
    driver: bridge
    ipam:
      config:
        - subnet: 172.110.2.0/24
          gateway: 172.110.2.1

