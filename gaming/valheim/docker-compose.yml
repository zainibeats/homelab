services:
  valheim:
    image: tsxcloud/valheim-arm:latest
    container_name: valheim-server
    restart: unless-stopped
    stop_grace_period: 2m
    cap_add:
      - sys_nice
    env_file: .env
    environment:
      TZ: ${TZ}
      SERVER_NAME: ${SERVER_NAME}
      SERVER_WORLD: ${WORLD_NAME}
      SERVER_PASSWORD: ${SERVER_PASS}
      SERVER_VISIBILITY: ${SERVER_PUBLIC}
      ENABLE_PLUGINS: "false"
      ENABLE_CROSSPLAY: "false"
    volumes:
      - ./config:/root/.config/unity3d/IronGate/Valheim
      - ./data:/root/valheim-server
    networks:
      services:
        ipv4_address: ${VALHEIM_IP:?set VALHEIM_IP in .env}   # on the NetBird-routed "services" network

networks:
  services:
    external: true
    name: services   # created by infrastructure/netbird-server or infrastructure/netbird-client
